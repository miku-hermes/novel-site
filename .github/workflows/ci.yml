name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend deps
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Dependency audit
        run: npm audit --omit=dev
