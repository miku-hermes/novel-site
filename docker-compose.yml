services:
  novel-site:
    image: ghcr.io/miku-hermes/novel-site:latest
    container_name: novel-site
    restart: unless-stopped
    networks:
      1panel-network:
        ipv4_address: 172.18.0.9
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      # 从 .env 读取（生产密钥不入库）
      - SESSION_SECRET=${SESSION_SECRET}
      - BACKUP_PASSWORD=${BACKUP_PASSWORD}
      - ALLOW_REGISTER=${ALLOW_REGISTER:-true}
      - SITE_NAME=${SITE_NAME:-喵的书架}
      # 刮削系统：DeepSeek API Key（可选，未配置则 LLM 刮削跳过）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # 刮削系统：自建 scraper-api 服务（起点刮削，内部 Camofox）
      - SCRAPER_API_URL=http://172.18.0.10:3200
    # 内网访问，不暴露宿主机端口，由 1Panel 反代
    expose:
      - "3000"

networks:
  1panel-network:
    external: true
